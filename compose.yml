services:
  licenses:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "licensing.api:from_env", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-access-log", "--proxy-headers", "--forwarded-allow-ips=172.30.83.2"]
    volumes:
      - license-data:/data
      - ./secrets/signing.pem:/run/secrets/signing.pem:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      licensing:
        ipv4_address: 172.30.83.3
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      ORCAPRIME_PUBLIC_ORIGIN: ${ORCAPRIME_PUBLIC_ORIGIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      licensing:
        ipv4_address: 172.30.83.2
    depends_on:
      - licenses
volumes:
  license-data:
  caddy-data:
  caddy-config:
networks:
  licensing:
    ipam:
      config:
        - subnet: 172.30.83.0/24
