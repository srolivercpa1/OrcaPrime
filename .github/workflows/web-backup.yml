name: OrçaPrime Web — backup diário criptografado

# schedule requires this workflow on the default branch. Enable only after configuring Secrets.
on:
  schedule:
    - cron: '17 6 * * *' # 03:17 America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orcaprime-web-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orcaprime-web-1.0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-web.txt
      - name: Gerar cópia consistente e criptografada
        env:
          DATABASE_URL: ${{ secrets.ORCAPRIME_BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.ORCAPRIME_BACKUP_ENCRYPTION_KEY }}
        run: |
          python - <<'PY'
          import os
          from webapp.cli import main
          import sys
          if not os.environ.get('DATABASE_URL') or not os.environ.get('BACKUP_ENCRYPTION_KEY'):
              raise SystemExit('Configure os dois Secrets de backup antes de executar.')
          sys.argv = ['webapp.cli', 'backup', '--encrypted', '--directory', 'cloud-backup']
          try:
              main()
          except Exception:
              # Database exception messages can include connection details. Do not print them.
              raise SystemExit('Backup não concluído. Verifique conexão, permissões e chave; nenhum arquivo será publicado.') from None
          PY
      - name: Guardar somente o arquivo criptografado
        uses: actions/upload-artifact@v4
        with:
          name: OrcaPrime-backup-${{ github.run_id }}
          path: cloud-backup/*.json.gz.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
