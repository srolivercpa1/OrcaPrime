name: Testes e instalador OrçaPrime
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Instalar dependências de teste e build
        run: python -m pip install -r requirements-dev.txt
      - name: Testar regras, API, cliente e interface
        run: python -m pytest -q
  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Preparar Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar Inno Setup.' }
          }
      - name: Gerar executável, instalador e checksum
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OrcaPrime-Windows
          path: |
            release/OrcaPrime-Setup.exe
            release/OrcaPrime-Setup.exe.sha256
            release/OrcaPrime-Portable.zip
            release/OrcaPrime-Portable.zip.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OrcaPrime-Windows
          path: release
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            RELEASE_TAG="${RELEASE_REF#refs/tags/}"
          else
            RELEASE_TAG="$(python -c 'from orcaprime import __release_tag__; print(__release_tag__)')"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A Release $RELEASE_TAG já existe; não será substituída. Incremente a versão para publicar outra."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --title "OrçaPrime 1.0 — Premium R2" --notes "Revisão visual Premium R2: abas e painéis arredondados, cartões com degradê, navegação renovada e login refinado. Novo ícone verificado dentro do EXE e aplicado explicitamente aos atalhos e à barra de tarefas. Exibição 1.0; revisão do instalador 1.0.1. Dados preservados." release/OrcaPrime-Setup.exe release/OrcaPrime-Setup.exe.sha256 release/OrcaPrime-Portable.zip release/OrcaPrime-Portable.zip.sha256
